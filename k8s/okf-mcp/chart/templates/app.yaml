apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistentVolume.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistentVolume.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce PVC holds the git clone; two pods writing to it at once
    # would race on git operations, so roll old-then-new rather than side by side.
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: okf-mcp
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: NOTEBOOK_NAME
              value: {{ .Values.notebookName | quote }}
            - name: GBRAIN_ROOT
              value: /data/gbrain
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.httpRoute.hostnames | join "," | quote }}
            - name: GH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: gh_app_id
            - name: GH_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: gh_app_installation_id
            - name: GH_APP_PRIVATE_KEY
              value: /etc/okf-mcp/github/app.pem
          volumeMounts:
            - name: data
              mountPath: /data/gbrain
            - name: gh-app-key
              mountPath: /etc/okf-mcp/github
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
      volumes:
        # Only the PEM is projected (items), not every key in the Secret
        - name: gh-app-key
          secret:
            secretName: {{ .Values.secretName }}
            defaultMode: 0440
            items:
              - key: gh_app_private_key
                path: app.pem
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
